# Builds and tests justStem on macOS, Windows and Linux, and uploads the plug-ins.
# Pushing a v* tag builds with the fast model bundled (so every download works offline), zips each
# plug-in and Standalone app, builds the macOS .pkg installer, and creates a draft GitHub release.
# Pushing a models-stem* or models-midi* tag builds and publishes those shared models once as a
# prerelease for on-demand download (HQ mode, piano MIDI).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    if: "!startsWith(github.ref, 'refs/tags/models-')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,     name: macOS }    # Apple Silicon
          - { os: windows-2022, name: Windows }
          - { os: ubuntu-24.04, name: Linux }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Linux packages (JUCE needs these)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libcurl4-openssl-dev xvfb openbox

      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Inline instead of ilammy/msvc-dev-cmd, which still runs on Node 20. Loads the vcvars64 environment
        # into later steps.
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          }

      # The model is built from the public export (see scripts/prepare_demucs_onnx.py), downloaded
      # at a pinned commit and checked (scripts/fetch_model.sh), with pinned packages; cached until
      # any of those change. One cache per OS: the same recipe gives slightly different bytes on
      # Linux and macOS, and each zip should carry a model built on its own OS.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Model cache
        id: model
        uses: actions/cache@v6
        with:
          path: models/htdemucs_6s_opt.onnx
          key: model-${{ runner.os }}-${{ hashFiles('scripts/prepare_demucs_onnx.py', 'scripts/fetch_model.sh', 'scripts/requirements.txt') }}
      - name: Build the model
        if: steps.model.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install -r scripts/requirements.txt
          bash scripts/fetch_model.sh fast
          python scripts/prepare_demucs_onnx.py htdemucs_6s_fp16weights.onnx models/htdemucs_6s_opt.onnx

      # The MIDI model is used as published (pinned and checked by scripts/fetch_model.sh), only for the
      # tests: the plug-in downloads it the first time MIDI is on.
      - name: MIDI model cache
        id: midi
        uses: actions/cache@v6
        with:
          path: |
            models/transkun_piano.onnx
            models/transkun_piano_heads.onnx
            models/transkun_piano_frontend.bin
          key: midi-${{ hashFiles('scripts/fetch_model.sh') }}
      - name: Fetch the MIDI models
        if: steps.midi.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash scripts/fetch_model.sh piano

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUSTSTEM_BUNDLE_MODELS=FAST
      - name: Build
        run: cmake --build build

      # A fresh Windows has no Visual C++ runtime: justStem must link it in, and ship it for ONNX Runtime.
      - name: Check the Visual C++ runtime (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          a=build/justStem_artefacts/Release
          for bin in "$a/VST3/justStem.vst3/Contents/x86_64-win/justStem.vst3" "$a/Standalone/justStem.exe"; do
            if dumpbin //dependents "$bin" | grep -iE "msvcp140|vcruntime140"; then
              echo "::error::$bin still needs the Visual C++ runtime"; exit 1
            fi
          done
          for dir in "$a/VST3/justStem.vst3/Contents/x86_64-win" "$a/Standalone"; do
            for dll in msvcp140.dll msvcp140_1.dll vcruntime140.dll vcruntime140_1.dll; do
              ls "$dir"/$dll > /dev/null || { echo "::error::$dll missing in $dir"; exit 1; }
            done
          done
          echo "justStem links the runtime in; ONNX Runtime has its runtime DLLs beside it"

      - name: Test analysis (resampler, loudness, key, tempo, chords, pitch shift)
        run: build/juststem_cli_artefacts/Release/juststem_cli analyze-selftest
      - name: Test separation
        run: build/juststem_cli_artefacts/Release/juststem_cli selftest models/htdemucs_6s_opt.onnx 12
      - name: Test MIDI
        run: build/juststem_cli_artefacts/Release/juststem_cli midi-selftest models
      - name: Test plug-in UI and audio
        shell: bash
        env:
          JUSTSTEM_DATA_DIR: ${{ runner.temp }}/juststem-data
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # A window manager too: without one, JUCE's desktop windows (the Save all progress window)
            # set window-manager properties that don't exist yet, and X ends the process (BadAtom).
            xvfb-run -a sh -c 'openbox & sleep 2; exec build/juststem_uitest_artefacts/Release/juststem_uitest models/htdemucs_6s_opt.onnx --synth build/uitest'
          else
            build/juststem_uitest_artefacts/Release/juststem_uitest models/htdemucs_6s_opt.onnx --synth build/uitest
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: justStem-${{ matrix.name }}
          path: |
            build/justStem_artefacts/Release/VST3
            build/justStem_artefacts/Release/AU
            build/justStem_artefacts/Release/Standalone
          if-no-files-found: error

      # Release zips: one per plug-in format, the bundle at the top of the zip.
      - name: Zip for release
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          cmake_ver=$(sed -n 's/^project(justStem VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          # A suffix (v0.0.3-ci-test) is allowed, for test releases; the number must match.
          if [ "${ver%%-*}" != "$cmake_ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the CMake version $cmake_ver"; exit 1
          fi
          out="$PWD/release"; mkdir -p "$out"
          cd build/justStem_artefacts/Release
          pack() { # <folder> <bundle> <format>
            local zip="$out/justStem-$ver-${{ matrix.name }}-$3.zip"
            if [ "$RUNNER_OS" = macOS ]; then ditto -c -k --keepParent "$1/$2" "$zip"
            elif [ "$RUNNER_OS" = Windows ]; then (cd "$1" && 7z a -tzip -bd "$zip" "$2" >/dev/null)
            else (cd "$1" && zip -qry "$zip" "$2"); fi
          }
          pack VST3 justStem.vst3 VST3
          if [ "$RUNNER_OS" = macOS ]; then
            pack AU justStem.component AU
            pack Standalone justStem.app Standalone
          else
            # Windows and Linux Standalone builds place loose files in Standalone/; wrap them in justStem/.
            wrap="$PWD/.pack-standalone"; rm -rf "$wrap"; mkdir -p "$wrap"
            cp -R Standalone "$wrap/justStem"
            rm -f "$wrap/justStem/"*.exp "$wrap/justStem/"*.lib # MSVC link leftovers, not needed to run
            (cd "$wrap" && if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip -bd "$out/justStem-$ver-${{ matrix.name }}-Standalone.zip" justStem >/dev/null; else zip -qry "$out/justStem-$ver-${{ matrix.name }}-Standalone.zip" justStem; fi)
            rm -rf "$wrap"
          fi
          ls -l "$out"
      - name: Build macOS installer (.pkg)
        if: env.RELEASE == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          cmake_ver=$(sed -n 's/^project(justStem VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          out="$PWD/release"
          stage="$PWD/build/pkg-stage"
          rm -rf "$stage"
          mkdir -p "$stage/roots/vst3" "$stage/roots/au" "$stage/roots/standalone" "$stage/roots/model" \
                   "$stage/scripts/vst3" "$stage/scripts/au" "$stage/scripts/standalone" "$stage/scripts/model"

          art="$PWD/build/justStem_artefacts/Release"
          ditto "$art/VST3/justStem.vst3" "$stage/roots/vst3/justStem.vst3"
          ditto "$art/AU/justStem.component" "$stage/roots/au/justStem.component"
          ditto "$art/Standalone/justStem.app" "$stage/roots/standalone/justStem.app"
          cp models/htdemucs_6s_opt.onnx "$stage/roots/model/"

          # Keep one shared copy of the fast model in /Library/Application Support/justStem/models
          # instead of repeating 155 MB inside all three bundles in the .pkg.
          for b in "$stage/roots/vst3/justStem.vst3" \
                   "$stage/roots/au/justStem.component" \
                   "$stage/roots/standalone/justStem.app"; do
            rm -f "$b/Contents/Resources/htdemucs_6s_opt.onnx"
            codesign --force --sign - "$b"
          done

          make_postinstall() {
            local script="$1" item="$2"
            cat > "$script" <<EOF
          #!/bin/sh
          if [ -e "\$2/$item" ]; then
              xattr -rd com.apple.quarantine "\$2/$item" 2>/dev/null || true
          fi
          exit 0
          EOF
            chmod 755 "$script"
          }
          make_postinstall "$stage/scripts/vst3/postinstall" "justStem.vst3"
          make_postinstall "$stage/scripts/au/postinstall" "justStem.component"
          make_postinstall "$stage/scripts/standalone/postinstall" "justStem.app"
          make_postinstall "$stage/scripts/model/postinstall" "htdemucs_6s_opt.onnx"

          build_component() {
            local kind="$1" id="$2" loc="$3"
            xattr -cr "$stage/roots/$kind"
            pkgbuild --analyze --root "$stage/roots/$kind" "$stage/$kind.plist"
            plutil -replace 0.BundleIsRelocatable -bool false "$stage/$kind.plist"
            pkgbuild --root "$stage/roots/$kind" \
              --component-plist "$stage/$kind.plist" \
              --scripts "$stage/scripts/$kind" \
              --identifier "$id" \
              --version "$cmake_ver" \
              --install-location "$loc" \
              "$stage/$kind.pkg"
          }

          build_component vst3 com.juststem.juststem.vst3 /Library/Audio/Plug-Ins/VST3
          build_component au com.juststem.juststem.au /Library/Audio/Plug-Ins/Components
          build_component standalone com.juststem.juststem.standalone /Applications
          xattr -cr "$stage/roots/model"
          pkgbuild --root "$stage/roots/model" \
            --scripts "$stage/scripts/model" \
            --identifier com.juststem.juststem.model \
            --version "$cmake_ver" \
            --install-location "/Library/Application Support/justStem/models" \
            "$stage/model.pkg"

          cat > "$stage/distribution.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
              <title>justStem $ver</title>
              <options customize="always" require-scripts="false" hostArchitectures="arm64"/>
              <domains enable_anywhere="false" enable_currentUserHome="true" enable_localSystem="true"/>
              <choices-outline>
                  <line choice="vst3"/>
                  <line choice="au"/>
                  <line choice="standalone"/>
                  <line choice="model"/>
              </choices-outline>
              <choice id="vst3" title="VST3 Plug-in" description="Installs justStem.vst3 to Library/Audio/Plug-Ins/VST3">
                  <pkg-ref id="com.juststem.juststem.vst3"/>
              </choice>
              <choice id="au" title="Audio Unit (AU) Plug-in" description="Installs justStem.component to Library/Audio/Plug-Ins/Components (Logic, GarageBand)">
                  <pkg-ref id="com.juststem.juststem.au"/>
              </choice>
              <choice id="standalone" title="Standalone App" description="Installs justStem.app to Applications" selected="false">
                  <pkg-ref id="com.juststem.juststem.standalone"/>
              </choice>
              <choice id="model" title="Standard AI Model (Required)" description="Installs the shared HT-Demucs 6-stem model (163 MB) so justStem works offline" enabled="false">
                  <pkg-ref id="com.juststem.juststem.model"/>
              </choice>
              <pkg-ref id="com.juststem.juststem.vst3" version="$cmake_ver">vst3.pkg</pkg-ref>
              <pkg-ref id="com.juststem.juststem.au" version="$cmake_ver">au.pkg</pkg-ref>
              <pkg-ref id="com.juststem.juststem.standalone" version="$cmake_ver">standalone.pkg</pkg-ref>
              <pkg-ref id="com.juststem.juststem.model" version="$cmake_ver">model.pkg</pkg-ref>
          </installer-gui-script>
          EOF

          productbuild --distribution "$stage/distribution.xml" --package-path "$stage" "$out/justStem-$ver-macOS.pkg"
          rm -rf "$stage"
          ls -lh "$out"
      - name: Upload release assets
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: |
            release/*.zip
            release/*.pkg
          compression-level: 0 # already compressed
          if-no-files-found: error

  # A draft release with the installers and zips, once every platform built and passed its tests.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checksums, so downloads can be checked (see the README's Install section).
          (cd release && sha256sum *.zip *.pkg > SHA256SUMS && cat SHA256SUMS)
          ls -l release
          pre=(); case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac # v0.0.3-ci-test
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.pkg release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --draft "${pre[@]}" \
            --title "justStem ${GITHUB_REF_NAME#v}" --generate-notes

  # One-time model release: models-stem* (separation models) or models-midi* (MIDI models).
  # Prerelease so /releases/latest stays on app versions. A tag whose release already exists (made by
  # hand, e.g. by moving a release to a new tag) is left alone.
  models-release:
    if: startsWith(github.ref, 'refs/tags/models-')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Already released?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to do."
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.exists.outputs.yes != 'true'
        with:
          python-version: "3.12"
      - name: Build models
        if: steps.exists.outputs.yes != 'true'
        run: |
          mkdir -p release
          case "$GITHUB_REF_NAME" in
            models-midi*)
              bash scripts/fetch_model.sh piano
              cp models/transkun_piano* release/ ;;
            *)
              python -m pip install -r scripts/requirements.txt
              bash scripts/fetch_model.sh fast
              bash scripts/fetch_model.sh hq
              python scripts/prepare_demucs_onnx.py htdemucs_6s_fp16weights.onnx release/htdemucs_6s_opt.onnx
              python scripts/prepare_roformer_onnx.py bs_roformer_sw_6stem_fp16.onnx release/bs_roformer_sw_6stem_opt.onnx ;;
          esac
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Publish model release
        if: steps.exists.outputs.yes != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "$GITHUB_REF_NAME" --notes "Shared models downloaded on demand by justStem."
